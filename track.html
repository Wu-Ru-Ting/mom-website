<!-- track.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案件進度查詢 - 陳雅惠議員服務平台</title>
  <link rel="stylesheet" href="shared/design-system.css">
  <link rel="stylesheet" href="shared/topbar.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="shared/site.js" defer></script>
  <style>
    body { min-height: 100svh; display: flex; flex-direction: column; }
    .page-wrap { flex: 1; }
    .button-row { display: flex; gap: 1em; margin-top: 1.5em; }
    .button-row .action-button { flex: 1; width: auto; margin-top: 0; }
    .result {
      margin-top: 1.5em; padding: 1.2em;
      background: #e8f4ff; border: 1px solid #a6c8ff;
      border-radius: var(--radius-md); display: none;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div id="topbar-mount"></div>
  <script src="shared/topbar-loader.js"></script>

  <div class="page-wrap reveal">
    <h1 class="page-title">案件進度查詢</h1>
    <p class="page-subtitle">請輸入您填寫表單時的電子信箱與案件編號</p>

    <form id="trackForm" class="form-card" onsubmit="handleSearch(event)">
      <label for="email">電子信箱</label>
      <input type="email" id="email" required />

      <label for="caseid">案件編號</label>
      <input type="text" id="caseid" required />
      <p style="font-size:0.9em;color:var(--text-muted);margin-top:0.3em;">例如：ABC-20260207</p>

      <div class="button-row">
        <a href="index.html" class="action-button">回首頁</a>
        <button type="submit" class="action-button">查詢案件</button>
      </div>
    </form>

    <div id="result" class="result">
      <strong>查詢結果：</strong>
      <p id="resultText">（這裡會顯示查詢到的案件狀態）</p>
    </div>
  </div>

  <div id="footer-mount"></div>

  <script>
  function normalize(str){
    if(!str) return '';
    const s = str.trim().replace(/[！-～]/g,ch =>
      String.fromCharCode(ch.charCodeAt(0)-0xFEE0)
    ).replace('　',' ');
    return s.toLowerCase();
  }

  async function handleSearch(e){
    e.preventDefault();
    const email  = normalize(document.getElementById('email').value);
    const caseId = normalize(document.getElementById('caseid').value);

    const box = document.getElementById('result');
    const txt = document.getElementById('resultText');

    try {
      const res  = await fetch('https://opensheet.elk.sh/1_mUxHK6iXozkkeyZ8YV82AUUe0BQe4uqc-blRuD6yhU/progress');
      const data = await res.json();

      const row = data.find(r =>
        normalize(r['案件編號']) === caseId &&
        normalize(r['電子信箱']) === email
      );

      if (row) {
        const note = (row['備註'] || '').replaceAll('\\n','<br/>');
        txt.innerHTML = `案件狀態：<strong>${row['案件狀態']}</strong><br/>備註：${note || '—'}`;
      } else {
        txt.innerHTML = '<span style="color:red;">查無此案件，請確認輸入正確（請使用半形英數）。</span>';
      }
      box.style.display = 'block';
    } catch (err) {
      txt.innerHTML = '<span style="color:red;">無法讀取資料，請稍後再試。</span>';
      box.style.display = 'block';
    }
  }
  </script>
</body>
</html>
