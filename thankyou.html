<!-- thankyou.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>送出成功 - 陳情表單</title>
  <link rel="stylesheet" href="shared/design-system.css">
  <link rel="stylesheet" href="shared/topbar.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="shared/site.js" defer></script>
  <style>
    body { min-height: 100svh; display: flex; flex-direction: column; }
    .content-wrap { flex: 1; padding: 2em var(--space-sm); padding-top: calc(var(--topbarH) + 2em); }
  </style>
</head>
<body>
  <div id="topbar-mount"></div>
  <script src="shared/topbar-loader.js"></script>

  <div class="content-wrap reveal">
    <div class="thankyou-box">
      <h1 class="page-title" style="margin-bottom:0.5em;">表單已成功送出！</h1>
      <p>感謝您的陳情，我們已收到資料。</p>
      <p>以下是您的案件編號：</p>
      <div class="case-id" id="caseId">載入中...</div>
      <div class="note" style="color:var(--text-muted);line-height:1.7;">
        此編號已寄至您的信箱，可用於查詢案件進度。<br>
        如有任何問題，歡迎聯絡服務處。
      </div>
      <a href="index.html" class="primary-btn">返回首頁</a>
    </div>
  </div>

  <div id="footer-mount"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const caseId = params.get("caseId");
    document.getElementById("caseId").textContent = caseId ? caseId : "（未取得案件編號）";
  </script>
</body>
</html>
