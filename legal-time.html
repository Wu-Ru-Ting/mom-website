<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="shared/design-system.css">
  <link rel="stylesheet" href="shared/topbar.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="shared/site.js" defer></script>
  <style>
    body { min-height: 100svh; display: flex; flex-direction: column; }
    .content-wrap { flex: 1; padding-bottom: var(--space-lg); }
    .image-container {
      width: 90%; max-width: 700px;
      margin: 0 auto; padding: var(--space-sm);
    }
    .image-container img {
      width: 100%; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .center-button {
      display: flex; justify-content: center;
      gap: var(--space-sm); flex-wrap: wrap;
      margin-top: var(--space-sm);
    }
    .note {
      text-align: center; color: var(--text-muted);
      margin: var(--space-sm) auto var(--space-lg);
      padding: 0 var(--space-sm);
    }
  </style>
</head>
<body>
  <div id="topbar-mount"></div>
  <script src="shared/topbar-loader.js"></script>

  <div class="content-wrap reveal">
    <h1 class="page-title" style="margin-top:var(--space-md);">法律諮詢時間</h1>

    <div class="image-container">
      <img src="legal-schedule.jpg" alt="法律諮詢時間表">
    </div>

    <div class="center-button">
      <a href="index.html" class="btn btn-secondary">返回首頁</a>
      <a href="https://lin.ee/hR8ZJk4" class="btn btn-primary" target="_blank" rel="noopener">
        我要預約 <i data-lucide="arrow-right" class="btn-icon" style="width:16px;height:16px"></i>
      </a>
    </div>

  </div>

  <div id="footer-mount"></div>
</body>
</html>
