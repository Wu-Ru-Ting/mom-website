<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息報你知 - 陳雅惠議員服務平台</title>
  <meta name="description" content="服務處公告與相關新聞，掌握陳雅惠議員最新動態與在地消息。">
  <link rel="stylesheet" href="shared/design-system.css">
  <link rel="stylesheet" href="shared/topbar.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="shared/site.js" defer></script>
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .messages-header { text-align: center; padding: var(--space-md) var(--space-sm) 0; }
    .messages-header h1 { color: var(--primary); margin-bottom: 0.5em; }
    .messages-header p { color: var(--text-muted); line-height: 1.7; max-width: 36em; margin: 0 auto; }
    .messages-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      max-width: 720px;
      margin: var(--space-lg) auto;
      padding: 0 var(--space-sm);
      flex: 1;
    }
    .messages-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-lg) var(--space-md);
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .messages-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .messages-card .card-icon {
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: 50%;
      margin-bottom: var(--space-sm);
    }
    .messages-card h2 { color: var(--primary-dark); font-size: 1.25rem; margin: 0 0 0.5em; }
    .messages-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin: 0 0 var(--space-md); }
    @media (max-width: 600px) {
      .messages-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="topbar-mount"></div>
  <script src="shared/topbar-loader.js"></script>

  <header class="messages-header container reveal">
    <h1 class="page-title">消息報你知</h1>
    <p>服務處最新公告與雅惠議員ㄟ相關新聞，一手掌握雅惠議員的動態與在地消息。</p>
  </header>

  <div class="messages-grid reveal">
    <a href="announcements.html" class="messages-card">
      <div class="card-icon"><i data-lucide="bell" style="width:28px;height:28px"></i></div>
      <h2>服務處公告</h2>
      <p>活動預約、法律諮詢、鄰里活動等最新消息</p>
      <span class="btn btn-primary btn-sm">查看公告</span>
    </a>
    <a href="news.html" class="messages-card">
      <div class="card-icon"><i data-lucide="newspaper" style="width:28px;height:28px"></i></div>
      <h2>相關新聞</h2>
      <p>議會質詢、民生交通、教育建設等媒體報導</p>
      <span class="btn btn-primary btn-sm">查看新聞</span>
    </a>
  </div>

  <div id="footer-mount"></div>
</body>
</html>
